# Builds the single-file `roswaal` for each platform and attaches it to a
# GitHub Release.
#
# Node's single-executable support cannot build for another platform, so each
# binary is built on its own: GitHub's macOS runner (Apple Silicon) and its
# Windows runner (x86-64). The names are the ones `build-binary.mjs` prints,
# which is what a toolchain manager looks for.
#
# Deliberate, as the site is: run it when a release is made, with that
# release's tag. A tag with no release yet gets a draft, for the notes to be
# written into before it is published.
#
# The macOS binary is signed ad hoc, which a download does not get past
# Gatekeeper with; Getting Started says how to let it run. A Developer ID and
# notarisation are what would remove that step.
name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.146.0. It has to name the version in version.json."
        required: true
        type: string

# Read-only, except for the two jobs that touch the release: making the draft
# and attaching the zips. Neither installs or runs anything from npm, so the
# build -- `npm ci` and every script it runs -- never holds the right to write
# to the repository. The zips go from the builds to `attach` as artifacts.
permissions:
  contents: read

# One run per tag at a time: two would race to replace each other's files.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Which line of development the binary's editor says it is, as the site does.
  ROSWAAL_CHANNEL: ${{ github.event.repository.name == 'roswaal-canary' && 'canary' || 'stable' }}
  TAG: ${{ inputs.tag }}

jobs:
  release:
    name: Check the tag and the release
    runs-on: ubuntu-latest
    # Makes the draft release when there is none yet.
    permissions:
      contents: write
    steps:
      # Every action by the commit it is, not a tag that can be moved: the
      # comment says which release that commit was.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A binary built from one commit and attached to another version's
      # release is a binary nobody can trace.
      - name: The tag names this version
        run: |
          version="$(node -p 'require("./version.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, and version.json says $version. Run this from the commit that release is of."
            exit 1
          fi

      - name: A release to attach to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "Roswaal ${TAG#v}" --notes "Notes to follow."
          fi

  binaries:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      # One platform failing should not take the other's binary with it.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-14
            asset: macos-aarch64
            binary: roswaal
          - name: Windows (x86-64)
            runner: windows-latest
            asset: windows-x86_64
            binary: roswaal.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # postject, which writes the editor into the binary, is a pinned
      # devDependency, so `npm ci` brings the same one on every runner.
      - run: npm ci

      - name: Build the editor and the binary
        shell: bash
        run: |
          npm run build:themes
          npm run build:web
          npm run build:binary

      - name: Smoke-test the binary
        shell: bash
        run: |
          out="$(./dist-binary/${{ matrix.binary }} version)"
          echo "$out"
          [ "$out" = "${TAG#v}" ] || { echo "::error::The binary says $out, not ${TAG#v}."; exit 1; }

      # The binary carries Node.js and other people's packages, whose licences
      # ask for their notices to go with every copy: THIRD-PARTY-NOTICES.txt
      # travels in the zip beside it. build-binary.mjs writes it.
      - name: Zip it
        shell: bash
        run: |
          asset="roswaal-${TAG#v}-${{ matrix.asset }}.zip"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          [ -s dist-binary/THIRD-PARTY-NOTICES.txt ] || { echo "::error::No THIRD-PARTY-NOTICES.txt beside the binary."; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path dist-binary/${{ matrix.binary }},dist-binary/THIRD-PARTY-NOTICES.txt -DestinationPath $asset"
          else
            (cd dist-binary && zip -9 "../$asset" "${{ matrix.binary }}" THIRD-PARTY-NOTICES.txt)
          fi

      # Handed to `attach`, which holds the right this job does not.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  attach:
    name: Attach the binaries to the release
    needs: [release, binaries]
    # Whatever was built is attached, as when each build attached its own: one
    # platform failing does not keep the other's binary from the release.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          zips=(assets/roswaal-"${TAG#v}"-*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No binary was built to attach."; exit 1; }
          gh release upload "$TAG" "${zips[@]}" --repo "$GITHUB_REPOSITORY" --clobber
