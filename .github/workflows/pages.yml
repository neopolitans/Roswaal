# Publishes the website: the editor over a volume in memory, and the docs.
#
# Deliberate rather than automatic. `main` carries work in progress -- most of
# this repository's commits are not releases -- and the site is a public preview
# that people are being asked to try, so it publishes when somebody says to
# rather than on every push. Add a `push:` trigger below when that stops being
# the right trade.
#
# Three repositories run it, and each is a site:
#
# - `neopolitans/roswaal-site` calls it to publish roswaal.app. That repository
#   holds nothing but the call; the source is this one's `main`.
# - `roswaal-canary` runs it for canary.roswaal.app.
# - This repository runs it for neopolitans.github.io/Roswaal/, the backup copy
#   at the address the site had before roswaal.app. A browser keeps storage per
#   address, so the copy stays for anybody whose project is kept there.
#
# A domain is set in each repository's Pages settings: a deploy from Actions
# ignores a CNAME file.
name: Site

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: The repository to build, when it is not the caller.
        type: string
        default: ""

# The token is minted for this run and scoped to publishing. Nothing here needs
# to write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer one waits rather than cancelling: a
# half-finished deploy that loses to a cancellation leaves the site as it was,
# which is fine, but the run reads as a failure and the next person re-runs it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Where the site is mounted. roswaal.app and canary.roswaal.app are served
  # from the root; the backup copy is a project site on github.io, served from
  # `/Roswaal/`. This is the only place the base is written down --
  # `build-pages.mjs` reads it back out of what Vite built.
  ROSWAAL_BASE: ${{ github.event.repository.name == 'Roswaal' && '/Roswaal/' || '/' }}
  # Which line of development this build is from. `canary` puts the yellow mark
  # on every surface, the warning banner above them, and `noindex` in every
  # page's head. Anything but `canary` is the stable build.
  ROSWAAL_CHANNEL: ${{ github.event.repository.name == 'roswaal-canary' && 'canary' || 'stable' }}
  # `1` on the backup copy: a banner pointing to roswaal.app on every surface,
  # and `noindex`, so search finds the site once.
  ROSWAAL_BACKUP: ${{ github.event.repository.name == 'Roswaal' && '1' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A caller names which of Roswaal's own repositories to build, and nothing
      # else: the build runs that repository's code with this workflow's token.
      - name: Check the source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          case "$SOURCE" in
            ""|neopolitans/Roswaal|neopolitans/roswaal-canary) ;;
            *) echo "::error::source must be neopolitans/Roswaal or neopolitans/roswaal-canary, not '$SOURCE'"; exit 1 ;;
          esac

      # Every action by the commit it is, not a tag that can be moved: the
      # comment says which release that commit was.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Another repository's default branch when `source` is given.
          repository: ${{ inputs.source || github.repository }}
          # Nothing after this step pushes, so the token does not stay behind.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Before building, not after. A broken build is cheap to fix and a broken
      # deploy is a public URL that people have been told to try.
      - name: Test
        run: npm test

      - name: Build the editor
        run: npm run build:site

      - name: Build the documentation
        run: npm run build:docs

      - name: Assemble the site
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
