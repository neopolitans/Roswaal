name: An idea or a request
description: Something Roswaal could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you would like
      description: What you are trying to do, and where Roswaal gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it might work
      description: Optional. A sketch, a screenshot of another tool, or a few lines of the Luau you would want.
